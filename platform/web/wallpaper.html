<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dragon</title>
<style>
  /* Background-only prototype: the wallpaper, not the timer.
   *
   * docs/00 asks for furniture that disappears -- "the painting is the
   * product; this is the frame around it" -- so there is no chrome at all:
   * no timer readout, no dev drawer, no title, no text once the hint fades.
   * What you are looking at is what the desktop would show.
   *
   * Letterboxed rather than cropped, because docs/00 is absolute about
   * scaling: "Integer scale only. Never fractional scaling, never bilinear
   * filtering on the world." A viewport that is not an exact multiple of
   * 480x270 gets bars, never a stretched painting. */
  :root { --night: #0b0e13; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); }

  #stage { position: fixed; inset: 0; display: grid; place-items: center; }

  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    /* the painting sits on its own paper, so the letterbox reads as a mat
     * around a print rather than as a page with a hole in it */
    box-shadow: 0 0 0 1px #1a212b, 0 30px 90px -30px #000;
  }

  /* The only affordance, and it is not furniture: it fades in on load and on
   * mouse move, then leaves. A wallpaper you cannot pause is one people
   * uninstall angrily (docs/50, "Pets, not processes"), so the key has to be
   * discoverable without being permanently on screen. */
  #hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    font: 11px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .18em; color: #59667a;
    opacity: 0; pointer-events: none; transition: opacity .9s ease;
  }
  #hint.on { opacity: 1; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="480" height="270"></canvas></div>
<div id="hint">space · pause</div>

<script>
/* Everything the page needs is declared before dragon.js loads, because the
 * Emscripten runtime fills in this same Module object and calls
 * onRuntimeInitialized on it. */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;
const img = ctx.createImageData(480, 270);

const FRAME_MS = 1000 / 15;      /* docs/50: 15 fps is the look, not a compromise */
const SEED = 0x5EED0D1A;         /* the documented world seed, so the pan is the
                                  * same landscape everyone else is reviewing */

let last = 0, acc = 0, paused = false;
let hintTimer = 0;

/* Integer scale that fits, clamped to 1 so a small window still shows the
 * whole frame instead of a crop. */
function fit() {
  const pad = 48;
  const s = Math.max(1, Math.floor(Math.min(
    (innerWidth - pad) / 480,
    (innerHeight - pad) / 270
  )));
  canvas.style.width = (480 * s) + 'px';
  canvas.style.height = (270 * s) + 'px';
  canvas.dataset.scale = s;
}

function showHint() {
  const h = document.getElementById('hint');
  h.classList.add('on');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => h.classList.remove('on'), 2600);
}

function present() {
  const ptr = Module._dragon_frame_ptr(Module.world);
  img.data.set(Module.HEAPU8.subarray(ptr, ptr + 480 * 270 * 4));
  ctx.putImageData(img, 0, 0);
}

function loop(now) {
  requestAnimationFrame(loop);
  if (!last) { last = now; return; }
  let dt = now - last;
  last = now;

  /* Fixed timestep with an accumulator, never variable dt (docs/50): the
   * scene is deterministic, and a variable step would make the same seed
   * produce different frames on different machines.
   *
   * Clamping the catch-up is the tab-wake guard -- replaying a backlog would
   * jerk the pan forward by minutes after a hidden tab comes back. */
  if (dt > 250) dt = 250;

  if (!paused) {
    acc += dt;
    while (acc >= FRAME_MS) {
      Module._dragon_step(Module.world, 1 / 15);
      acc -= FRAME_MS;
    }
  } else {
    acc = 0;
  }

  present();
}

addEventListener('resize', fit);

/* Pause freezes the whole world, not just the camera. The core also exposes a
 * pan-only pause, but that exists for measurement -- docs/35 uses it to
 * separate life motion from camera motion. A user pressing pause expects the
 * painting to hold still. */
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); paused = !paused; showHint(); }
});
addEventListener('mousemove', showHint);

/* rAF already stops in a hidden tab, and stopping the world while the desktop
 * is not visible is the power story in docs/50. Resetting the clock on return
 * keeps the accumulator honest. */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { last = 0; acc = 0; }
});

var Module = {
  onRuntimeInitialized() {
    Module.world = Module._dragon_boot(SEED);
    Module._dragon_set_view(Module.world, 0);   /* DR_VIEW_SCENE: the composed background */
    fit();
    present();
    requestAnimationFrame(loop);
    showHint();
  }
};
</script>
<script src="dragon.js"></script>
</body>
</html>
